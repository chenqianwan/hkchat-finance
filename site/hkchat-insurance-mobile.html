</div><script>(()=>{'use strict';const DATA={"sources": [{"name": "保險業監管局｜投保注意事項：先了解需要、細閱條款（一般概念）", "url": "https://education.ia.org.hk/tc/faq.html"}, {"name": "保險業監管局｜旅遊保險簡介：保障須配合行程、留意不保事項（一般概念）", "url": "https://www.ia.org.hk/tc/travel_insurance/index.html"}], "cases": [{"id": "new-job", "title": "返新工，保障係咪自動齊？", "tag": "新工第一週", "desc": "虛構對話練習。阿晴剛返新工，想弄清楚保障；你有三輪，先聽需要，再解釋，最後留空間。", "customer": {"name": "阿晴", "identity": "剛返新工的虛構客戶｜辦公室茶水間都仲未認熟", "opening": "返新工一星期，電郵已經多過我認得嘅同事！公司話有醫療保障，我想先搞清楚有啲咩。"}, "context": "人物、公司安排及「日常練習 A」全部虛構，只用來練習顧問對話。以下是簡化練習卡，不代表真實產品或完整條款，也不判斷任何人的承保或索償結果。", "facts": [{"title": "客戶背景｜公司手冊未到手", "text": "阿晴最想了解一般門診和例行牙科檢查；她尚未拿到公司保障手冊，公司安排的具體範圍未核實。"}, {"title": "虛構範圍｜一般門診", "text": "「日常練習 A」把一般門診列入練習中的保障範圍。這項設定不等於任何門診情況都必定獲賠。"}, {"title": "虛構限制｜例行牙科不包括", "text": "「日常練習 A」不包括例行牙科檢查；不能把一般門診說成連牙科也包括。"}], "stages": [{"title": "先問清楚需要", "prompt": "公司話有保障，係咪就乜都包？我有啲唔知由邊度問起。", "context": "你是顧問。先了解她關心的情況，以及手上有甚麼資料。", "choices": [{"id": "new-job-1-clear", "label": "先聽她擔心甚麼", "text": "我哋逐樣拆開睇。你最想了解邊類情況？公司嘅保障手冊到手未？", "reply": "主要係普通門診，同例行牙科檢查。手冊仲未有，HR 話遲啲先發畀我。咁樣逐樣問，我清楚啲。", "coach": "你問到了需要，也找出資料缺口。有公司保障這句話，還不足以說明具體範圍。", "kind": "clear", "evidence": ["關心門診及牙科", "公司手冊未到手"]}, {"id": "new-job-1-partial", "label": "先問入職多久", "text": "你返咗幾耐新工？等你適應咗先慢慢了解都得。", "reply": "啱啱一星期。其實我想知普通門診同例行牙科檢查，手冊又仲未到手；我想先知要睇邊幾樣。", "coach": "語氣輕鬆，但入職多久沒有回答她的疑問。接着問關心的項目和現有資料，會更有用。", "kind": "partial", "evidence": ["關心門診及牙科", "公司手冊未到手"]}, {"id": "new-job-1-overclaim", "label": "先給一句肯定答案", "text": "公司都有保障，門診牙科應該齊晒，你放心就得！", "reply": "我就係想知普通門診同例行牙科檢查。但手冊仲未到手喎，你點知齊晒？我反而有啲唔放心。", "coach": "你把未核實的公司安排說成已確認。先收回「齊晒」，再問需要和核對資料。", "kind": "overclaim", "evidence": ["公司範圍未核實", "未見手冊不能說齊全"]}], "guidance": "先問「你關心甚麼？」和「現有資料在哪裏？」；不要用一句放心，蓋過還未知道的事。"}, {"title": "把範圍和限制講清楚", "prompt": "咁用呢張「日常練習 A」做例子，門診同牙科究竟點分？我唔想聽完仲係一頭霧水。", "context": "現在只解釋虛構練習卡。公司安排仍未核實；不能把這張卡當成阿晴的現有保障。", "choices": [{"id": "new-job-2-clear", "label": "範圍、限制一起說", "text": "呢張虛構卡將一般門診列入範圍，但唔包括例行牙科檢查；列入範圍亦唔代表一定賠。公司安排要另睇手冊。呢兩項分別清楚嗎？", "reply": "明喇：呢張練習卡有一般門診，例行牙科就唔包括；公司嗰份仲要核對。你分開講，我跟得上。", "coach": "你同時交代了範圍、限制和未確認的部分，也讓客戶有機會確認理解。", "kind": "clear", "evidence": ["虛構卡列入一般門診", "例行牙科不包括"]}, {"id": "new-job-2-partial", "label": "先講她想聽的部分", "text": "呢張虛構卡有一般門診，正好係你想了解嘅項目。其他細節可以之後再睇。", "reply": "門診我聽到，但我頭先仲問咗例行牙科喎。嗰部分唔講，我都唔知自己明咗幾多。", "coach": "門診這部分有根據，但遺漏了她同樣關心的牙科限制。「之後再睇」不能代替現在清楚交代。", "kind": "partial", "evidence": ["客戶也關心牙科", "例行牙科不包括"]}, {"id": "new-job-2-overclaim", "label": "一句概括成全部包括", "text": "呢張卡既然包括門診，普通睇醫生同牙科都冇問題，肯定處理到！", "reply": "但卡上面寫住例行牙科唔包括喎。你話冇問題，同我睇到嘅唔一樣，我想先釐清呢點。", "coach": "這句與練習卡直接矛盾，也用了肯定結果的說法。應明確更正：例行牙科不包括，不能保證結果。", "kind": "overclaim", "evidence": ["例行牙科明確不包括", "不能保證結果"]}], "guidance": "講一項範圍，也講一項限制；再問客戶是否明白。虛構卡和公司的未核實安排要分開。"}, {"title": "回應疑慮，留她作決定", "prompt": "你係咪想我即刻決定？我返新工已經好多嘢要記，今日想先了解，唔想再做決定。", "context": "她已清楚表達想停下來。你的目標是回應她的顧慮，讓這次對話有一個舒服的結尾。", "choices": [{"id": "new-job-3-clear", "label": "尊重她今天先了解", "text": "明白，今日先了解就夠，我哋可以停喺呢度。我幫你記低兩點：公司範圍待核對，練習卡唔包括例行牙科。之後想再問，由你決定。", "reply": "好呀，兩點我記得住。今日先到呢度，等我睇完資料，有需要再問你。", "coach": "你接受了她的選擇，留下清晰重點，也把是否繼續交回客戶。這輪的成果是讓她聽明白。", "kind": "clear", "evidence": ["客戶只想先了解", "公司範圍仍待核對"]}, {"id": "new-job-3-partial", "label": "先答應，再替她安排", "text": "唔使急，我聽日再搵你，我哋到時繼續。", "reply": "我明你想跟進，但聽日我都好忙。可唔可以等我想問嗰陣先搵你？", "coach": "你有說不用急，但未問她的意願就安排下一次。先接受今天停止，再讓她選擇是否跟進。", "kind": "partial", "evidence": ["客戶沒有要求跟進", "繼續與否由客戶選擇"]}, {"id": "new-job-3-overclaim", "label": "催她先答應再說", "text": "都講清楚喇，你而家答應先啦，其他資料遲啲補睇就得。", "reply": "我已經話今日唔想決定，你仲催我。我想結束呢次對話。", "coach": "她已表明不想決定，而公司資料仍未核實。不要把「講完」當成客戶理解或同意；應停止催促。", "kind": "overclaim", "evidence": ["客戶已表明想停止", "公司範圍仍待核對"]}], "guidance": "先回應「今日只想了解」，再整理重點。是否繼續、何時繼續，都讓客戶選擇。"}], "takeaway": "我的顧問任務：先聽她需要甚麼，把已知和未知說清楚，讓她安心說「今日先到呢度」。", "followup": "下次再玩，試試用更短的一句，同時講到一項範圍、一項限制，再留一句讓客戶選擇。"}, {"id": "weekend-trip", "title": "週末出走，朋友話一定賠？", "tag": "海風小旅行", "desc": "虛構對話練習。阿朗的週末行程未定，朋友已經一句包晒；你有三輪，問清活動，再把話說準。", "customer": {"name": "阿朗", "identity": "計劃週末小旅行的虛構客戶｜行李未執，群組已講到第十個行程", "opening": "星期六想去海邊小島玩兩日！朋友個群組一時話散步，一時話划獨木舟，我連帶邊對鞋都未決定。"}, "context": "人物、行程及「週末練習 B」全部虛構，只用來練習顧問對話。以下是簡化練習卡，不代表真實產品或完整條款，也不判斷任何人的承保或索償結果。", "facts": [{"title": "客戶背景｜活動還未定", "text": "阿朗會去小島兩日；已打算在有標示的步道散步，獨木舟仍只是朋友的提議。"}, {"title": "虛構範圍｜標示步道散步意外", "text": "「週末練習 B」把行程中在有標示的步道散步時發生的意外事故，列入練習中的保障範圍。列入範圍不等於保證索償成功。"}, {"title": "虛構限制｜獨木舟相關事故不包括", "text": "「週末練習 B」不包括獨木舟活動相關事故。不能把它概括成所有戶外活動都包括。"}], "stages": [{"title": "先問行程，別急着下結論", "prompt": "都係去玩兩日，係咪有旅遊保障就差唔多？", "context": "先把模糊的「去玩」問具體，分清已計劃和仍可能改變的活動。", "choices": [{"id": "weekend-trip-1-clear", "label": "問清楚會玩甚麼", "text": "先講講你哋會做啲咩：散步係咪行有標示嘅步道？獨木舟已經決定，定仲係提議？", "reply": "散步會行有標示嗰條步道。獨木舟仲未定，朋友話睇下到時有冇興致；我唔想估估下。", "coach": "你問到了活動內容和未定的部分。行程只有兩日，也不能單憑長短推斷保障範圍。", "kind": "clear", "evidence": ["會行標示步道", "獨木舟仍未決定"]}, {"id": "weekend-trip-1-partial", "label": "只問哪天最期待", "text": "兩日一夜，收到。你最期待邊一日嘅行程？", "reply": "應該係散步嗰日，會行有標示嘅步道。獨木舟仲未定；我最想知活動唔同，係咪都一樣。", "coach": "你有建立對話，但日期沒有解開他關心的活動差異。下一步應確認活動類型和未定項目。", "kind": "partial", "evidence": ["活動類型影響核對重點", "獨木舟仍未決定"]}, {"id": "weekend-trip-1-overclaim", "label": "用旅程短作保證", "text": "得兩日啫，散步划艇都係普通玩吓，有保障就冇問題！", "reply": "我哋會行有標示嘅步道，獨木舟就仲未定。點解兩日就代表冇問題？你都未睇活動點分。", "coach": "旅程短不能證明所有活動都包括。「冇問題」跳過了需要核對的範圍和限制。", "kind": "overclaim", "evidence": ["行程長短不能證明範圍", "獨木舟仍未決定"]}], "guidance": "把「去玩」問成具體活動；已定的記清楚，未定的留下來核對。"}, {"title": "用活動差異解釋限制", "prompt": "呢張「週末練習 B」對散步同獨木舟有咩分別？可唔可以一句講到明？", "context": "只按虛構練習卡說明，不把所有戶外活動當成同一類，也不判斷真實索償結果。", "choices": [{"id": "weekend-trip-2-clear", "label": "用兩項活動作對照", "text": "呢張虛構卡將標示步道散步嘅意外列入範圍，獨木舟相關事故就唔包括；列入範圍亦唔等於一定賠。你會點分返呢兩項？", "reply": "即係步道散步意外列入範圍，但獨木舟唔包括，唔可以一句當全部戶外活動都包。咁就清楚。", "coach": "你用客戶的兩項活動作對照，講清限制，再請他用自己的話確認理解。", "kind": "clear", "evidence": ["步道散步意外列入範圍", "獨木舟相關事故不包括"]}, {"id": "weekend-trip-2-partial", "label": "只解釋已定的活動", "text": "你講嗰條標示步道，散步意外有列入呢張虛構卡嘅範圍。其他活動到時先講。", "reply": "散步我明，但獨木舟都可能會玩喎。如果到時先講，我而家點理解兩者分別？", "coach": "說出的範圍有根據，但客戶明確問了兩項活動。應一併交代獨木舟的限制。", "kind": "partial", "evidence": ["客戶問了兩項活動", "獨木舟相關事故不包括"]}, {"id": "weekend-trip-2-overclaim", "label": "把戶外活動一概而論", "text": "散步都包括，獨木舟都係戶外活動，照道理一樣包晒！", "reply": "但卡上面寫獨木舟唔包括喎。『照道理』同張卡唔一致，我唔敢照你咁理解。", "coach": "活動同屬戶外，不代表範圍相同。這句忽略了明列的限制，應直接更正。", "kind": "overclaim", "evidence": ["獨木舟明確不包括", "戶外活動不能一概而論"]}], "guidance": "用「這項列入、那項不包括」說明差異；避免把活動的大分類當成保障承諾。"}, {"title": "面對「朋友話一定賠」", "prompt": "但朋友話佢試過，所以一定賠㗎喎。你係咪都可以保證？定我等行程定咗先再了解？", "context": "回應他的比較和不確定，不批評朋友，也不要承諾結果。讓他選擇是否繼續。", "choices": [{"id": "weekend-trip-3-clear", "label": "說明不能保證，讓他選擇", "text": "朋友嘅經驗可以係另一種情況，唔代表你呢次一樣，我唔可以保證結果。你可以等行程定咗先再了解；今日想停喺呢度，完全可以。", "reply": "好，我先同朋友定清楚玩啲咩。今日先到呢度，多謝你冇一句『得啦』就帶過。", "coach": "你沒有否定朋友的經驗，也沒有把經驗當成保證。接着接受客戶暫停，讓選擇真正留在他手上。", "kind": "clear", "evidence": ["朋友經驗不等於本次條件", "客戶可先確認行程"]}, {"id": "weekend-trip-3-partial", "label": "只說每次情況不同", "text": "每次情況唔同，條款要睇清楚。你自己再諗諗啦。", "reply": "我知道要睇清楚，但你仲未答可唔可以保證，同埋可唔可以等我定好行程先。", "coach": "方向合理，但太籠統。應清楚回答不能保證結果，也回應他想先確認行程的選擇。", "kind": "partial", "evidence": ["不能保證結果", "客戶提出先確認行程"]}, {"id": "weekend-trip-3-overclaim", "label": "跟着朋友的說法保證", "text": "你朋友都試過，咁我都可以保證冇問題。唔使等行程定，今日決定咗先啦！", "reply": "但你張卡明明有活動限制。連我玩咩都未定就保證，我想停低，唔繼續喇。", "coach": "你把他人的經驗當成保證，並在行程未定時催促決定。應收回承諾，尊重他停止對話。", "kind": "overclaim", "evidence": ["練習卡有明確活動限制", "行程仍未完全確定"]}], "guidance": "先承認每次情況可能不同，清楚說不能保證，再讓客戶選擇現在停下或繼續了解。"}], "takeaway": "我的顧問任務：問具體活動、講具體限制；面對「朋友話」，也不把未知說成一定。", "followup": "下次再玩，試試在不批評朋友的情況下，用一句話解釋為甚麼不能保證，再尊重客戶暫停。"}], "photo": "data:image/webp;base64,UklGRshtAABXRUJQVlA4ILxtAABw2gKdASogA1gCPmEulEckIqkmo3Gq+SAMCWduKP/b5MC/WKHMHkDXT23+nOYLxrHuoBvCP51dATzp/sDqEf9HmZDD0+sP60TRcdZmX9QZ19iz1L/1ref/33oWfNn3+GhEP/T56vjvZLDX/G+anvd/MvEviW+J/6R6ig8Dup+2yltR7SPStK0q6cAv8FlTqo1HBzCv1wh3RmPZOWzLgtz/AEx4CWNWV3h6ScqypGowNQsUBzyn9d26rVW8ReUetePdi9KNGVP/WSIPoQ7Q7cX7TonctybuvGDKZCcOtyHItOTG2RL4OaXpFm4cKj/ONkfBGPBG86+0e0qkUec5vrnjoR/Rzj7JxrzbHP1ZuPf+NquON3Sc3Z2PC73Zw9mhvphwS/YApp/AYAjGmUkfZE8OGtyzjIHWJlV+cJdXhO6h3R9H139AAALtcTl9mG1oHbfwrYZFpRn+E3aVylEWx4vykK5hn5M8XVe/dupDch3sgo4tSq5uZj8y7yTvq/ZcOtsDdYimSg/j2CtpihJzqPOaXEkiQ6bi1RRu5xCLaNClTNXVDFNTyp+4JWEQp3eRw1Oj0HgoDWJgpVdsMxYBBeT/std9wBtFHeNixKFts8R+0+ (() => {
  'use strict';
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let serial = 0;
  const pending = new WeakMap();
  function form({placeholder = '講吓你想練習嘅難題……', examples = [], value = ''} = {}) {
    const id = 'sg-topic-' + (++serial);
    return `<section class="sg-compose" aria-labelledby="${id}-title"><div class="sg-heading"><span class="sg-spark" aria-hidden="true">✦</span><div><span class="sg-eyebrow">由你出題</span><h2 id="${id}-title">想試另一個情境？</h2></div><span class="sg-tag">生成演示</span></div><p class="sg-intro">講吓遇到嘅人、場合，同你想練習嘅難題。</p><form data-sg-form novalidate><label class="sg-label" for="${id}">我想練習……</label><textarea id="${id}" data-sg-input maxlength="180" rows="3" placeholder="${esc(placeholder)}" aria-describedby="${id}-help ${id}-error">${esc(value)}</textarea><div class="sg-input-meta"><span id="${id}-help">4–180 字 · 只需虛構情境</span><span data-sg-count>${value.length} / 180</span></div><div class="sg-examples" aria-label="試用出題靈感">${examples.map(x => `<button type="button" data-sg-example="${esc(x)}">${esc(x)}</button>`).join('')}</div><p class="sg-error" id="${id}-error" data-sg-error role="alert"></p><button class="sg-submit" type="submit"><span aria-hidden="true">✦</span> 生成我的情境 <span aria-hidden="true">→</span></button></form><p class="sg-note">靜態演示：按描述組合練習，回應使用示範分支。自訂內容只留在本頁，重新整理即清除。</p></section>`;
  }
  function bind(main, onGenerate) {
    const f = main.querySelector('[data-sg-form]');
    if (!f || f.dataset.bound) return;
    f.dataset.bound = 'true';
    const input = f.querySelector('[data-sg-input]'), error = f.querySelector('[data-sg-error]');
    input.addEventListener('input', () => {
      f.querySelector('[data-sg-count]').textContent = `${input.value.length} / 180`;
      error.textContent = ''; input.removeAttribute('aria-invalid');
    });
    f.querySelectorAll('[data-sg-example]').forEach(b => b.addEventListener('click', () => {
      input.value = b.dataset.sgExample;
      input.dispatchEvent(new Event('input', {bubbles:true})); input.focus();
    }));
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (prompt.length < 4 || prompt.length > 180) {
        error.textContent = '用 4–180 字講吓你想練習嘅情境。'; input.setAttribute('aria-invalid','true'); input.focus(); return;
      }
      const button = f.querySelector('[type="submit"]');
      if (button.disabled) return;
      button.disabled = true;
      try { await onGenerate(prompt); }
      catch (err) {
        console.error('Scenario preparation failed', err);
        if (f.isConnected) error.textContent = '未能準備情境，請再試一次。';
      } finally { button.disabled = false; }
    });
  }
  function prepare(main, {label = '正在生成今次嘅情境', prompt = '', onCancel = () => {}} = {}) {
    pending.get(main)?.();
    return new Promise(resolve => {
      const steps = ['整理題材與背景', '安排角色與問題', '準備好，輪到你出場'];
      let done = false;
      const timers = [];
      main.innerHTML = `<section class="sg-loading" data-sg-loading aria-labelledby="sg-loading-title"><span class="sg-orbit" aria-hidden="true">✦</span><span class="sg-eyebrow">情境生成中</span><h1 id="sg-loading-title" tabindex="-1">${esc(label)}</h1>${prompt ? `<p class="sg-prompt">${esc(prompt)}</p>` : '<p class="sg-prompt">將題材變成一場可以參與嘅練習。</p>'}<ol class="sg-steps">${steps.map((s,i) => `<li data-sg-step="${i}"${i === 0 ? ' aria-current="step"' : ''}><span aria-hidden="true">${i+1}</span>${s}</li>`).join('')}</ol><p class="sg-live" role="status" aria-live="polite">${steps[0]}</p><p class="sg-note">靜態生成演示 · 使用示範內容</p><button type="button" class="sg-cancel" data-sg-cancel>返回修改</button></section>`;
      const panel = main.querySelector('[data-sg-loading]');
      window.scrollTo({top:0,behavior:'instant'});
      main.querySelector('h1').focus({preventScroll:true});
      const finish = value => {
        if (done) return;
        done = true; timers.forEach(clearTimeout); pending.delete(main); resolve(value);
      };
      const cancel = () => finish(false);
      pending.set(main, cancel);
      main.querySelector('[data-sg-cancel]').addEventListener('click', () => {finish(false); onCancel();});
      steps.slice(1).forEach((_,i) => timers.push(setTimeout(() => {
        if (!panel.isConnected) {finish(false); return;}
        panel.querySelectorAll('[data-sg-step]').forEach((li,n) => {
          li.classList.toggle('sg-complete', n <= i);
          if (n === i+1) li.setAttribute('aria-current','step'); else li.removeAttribute('aria-current');
        });
        panel.querySelector('.sg-live').textContent = steps[i+1];
      }, (i+1)*500)));
      timers.push(setTimeout(() => finish(panel.isConnected), 1550));
    });
  }
  window.HKScenario = Object.freeze({form, bind, prepare});
})();

const main=document.getElementById('role-main'),root=document.getElementById('hkroles');
const E=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=id=>({view:'home',id:id||DATA.cases[0].id,index:0,draft:'',selected:null,records:[],trialIndex:0,trial:null,custom:null});
let s=fresh(),pending=null;
const scene=()=>s.custom||DATA.cases.find(c=>c.id===s.id)||DATA.cases[0];
const stage=()=>scene().stages[s.view==='practice'?s.trialIndex:s.index];
const labels={clear:'講清楚了',partial:'可再補一句',overclaim:'需要澄清',custom:'自訂文字 · 待覆核'};
const btn=(label,act,secondary=false,extra='')=>'<button type="button" class="'+(secondary?'cv-secondary':'cv-primary')+'" data-act="'+act+'" '+extra+'>'+label+'</button>';
const badge=kind=>'<span class="ins-badge ins-badge-'+E(kind)+'">'+E(labels[kind])+'</span>';
const note=()=>'<p class="cv-disclosure">虛構客戶與簡化練習卡 · 只作溝通練習。客戶回應按預設選項演示，自訂文字不作自動判讀；未接即時 AI。內容只留在此頁，重新整理會清除。</p>';
const homeLink=()=>'<a class="ins-back" href="index.html">‹ 返回首頁</a>';
const say=text=>{document.getElementById('ins-announcer').textContent=text};
function render(html,focus=true){main.innerHTML=html;root.dataset.view=s.view;if(focus){main.querySelector('h1,h2')?.setAttribute('tabindex','-1');main.querySelector('h1,h2')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}}
function facts(){return '<details class="cv-facts"><summary>打開今局練習卡 · 3 個重點</summary><div class="cv-fact-list">'+scene().facts.map(f=>'<article class="cv-fact"><strong>'+E(f.title)+'</strong><p>'+E(f.text)+'</p></article>').join('')+'<p class="ins-prompt">'+E(scene().context)+'</p></div></details>'}
function sources(){return '<details class="cv-disclosure"><summary>了解更多 · 一般保險知識</summary><p>一般概念參考保監局教育資料；本局人物與保障卡是虛構設定，並非真實產品或機構認可。</p>'+DATA.sources.map(x=>'<a href="'+E(x.url)+'" target="_blank" rel="noopener noreferrer">'+E(x.name)+' ↗</a>').join('')+'</details>'}
function customer(){const c=scene();return '<div class="ins-customer"><span class="ins-avatar" aria-hidden="true">'+E(c.customer.name.slice(-1))+'</span><div><strong>'+E(c.customer.name)+'</strong><small>'+E(c.customer.identity)+'</small></div></div>'}
function bubble(text,label){return '<section class="cv-call"><span>'+E(label||scene().customer.name+' · 虛構客戶')+'</span><p>'+E(text)+'</p></section>'}
function tags(items){return '<div class="ins-fact-tags">'+items.map(x=>'<span>'+E(x)+'</span>').join('')+'</div>'}
