</script><style>
#hkhome{max-width:480px;min-height:100svh;margin:auto;color-scheme:light dark;display:flex;flex-direction:column}
#hkhome *{box-sizing:border-box}
#hkhome [hidden]{display:none!important}
#hkhome :is(h1,h2,p){margin:0}
#hkhome a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
#hkhome :is(a,button):focus-visible{outline:3px solid var(--p-primary);outline-offset:4px}
#hkhome .home-main{flex:1;display:flex;flex-direction:column;padding:25px 18px max(14px,env(safe-area-inset-bottom));background:radial-gradient(ellipse 90% 160px at 50% 0,var(--p-soft),transparent)}
#hkhome .home-hero{padding:4px 0 25px;text-align:center}
#hkhome .home-hero h1{font-size:27px;line-height:1.4;letter-spacing:-.7px;font-weight:650}
#hkhome .home-hero h1 span{color:var(--p-primary)}
#hkhome .home-hero p{margin-top:10px;color:var(--p-muted);font-size:13px;line-height:1.8}
#hkhome .home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#hkhome .home-app{position:relative;isolation:isolate;min-width:0;min-height:204px;display:flex;flex-direction:column;padding:14px 14px 15px;border:1px solid light-dark(#ffffff42,#ffffff24);border-radius:19px;background:#25212d;color:#fff;box-shadow:0 4px 14px light-dark(#25142e12,#0000001a);transition:border-color .15s ease,transform .15s ease;touch-action:manipulation}
#hkhome .home-photo-layer{position:absolute;inset:0;z-index:-1;border-radius:inherit;overflow:hidden;pointer-events:none;background:#302c36}
#hkhome .home-photo-layer img{display:block;width:100%;height:100%;object-fit:cover;object-position:right center;transform:scale(1.015)}
#hkhome .home-photo-layer::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#11101948 0%,#11101910 20%,#111019b8 46%,#111019ed 100%)}
#hkhome .home-app[data-app="council"] .home-photo-layer img{object-position:90% center}
#hkhome .home-app[data-app="mediation"] .home-photo-layer img{object-position:90% center}
#hkhome .home-card-top{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:32px}
#hkhome .home-card-link::after{content:"";position:absolute;inset:0;border-radius:19px}
#hkhome .home-card-link:focus-visible{outline:none}
#hkhome .home-card-link:focus-visible::after{outline:3px solid var(--p-primary);outline-offset:4px}
#hkhome .home-info{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:3px;min-width:48px;min-height:44px;margin:-4px -5px -4px 0;padding:0 4px;border:0;border-radius:11px;background:transparent;color:#fff;font:inherit;font-size:11px;text-shadow:0 1px 5px #0008;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#hkhome .home-info::before{content:"";position:absolute;inset:8px 0;z-index:-1;border:1px solid #ffffff2b;border-radius:20px;background:#1e192b5e;backdrop-filter:blur(9px)}
#hkhome .home-info svg{width:13px;height:13px}
#hkhome .home-info:hover::before,#hkhome .home-info:active::before{background:#382c48bc;border-color:#ffffff80}
#hkhome .home-app h2{font-family:inherit;font-size:17px;font-weight:600;line-height:1.45;letter-spacing:-.3px;min-height:49px;color:#fff;text-shadow:0 1px 8px #0005}
#hkhome .home-title-line{display:block}
#hkhome .home-app p{font-size:12px;color:#f0ebf3;line-height:1.75;margin-top:5px;text-shadow:0 1px 5px #0008;flex:1}
#hkhome .home-app[data-app="quiz"] .home-card-top{margin-bottom:18px}
#hkhome .home-quiz-modes{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:12px}
#hkhome .home-quiz-mode{display:flex;align-items:center;justify-content:center;min-width:0;min-height:44px;padding:6px 4px;border:1px solid #ffffff52;border-radius:24px;background:#211b2ce6;color:#fff;font-size:11.5px;font-weight:600;line-height:1.35;white-space:nowrap;text-align:center;touch-action:manipulation}
#hkhome .home-quiz-mode:first-child{background:#ead0f5;color:#291832;border-color:#ead0f5}
#hkhome .home-quiz-mode:hover,#hkhome .home-quiz-mode:active{border-color:#fff;box-shadow:0 0 0 1px #ffffff60}
#hkhome .home-app[data-app="match"]{grid-column:1/-1;min-height:180px}
#hkhome .home-app[data-app="match"] .home-card-top{margin-bottom:20px}
#hkhome .home-app[data-app="match"] h2{min-height:0}

<script>
{
const HOWTO = {"quiz": {"intro": "自己闖五關，或者試玩一場財智 PK。", "steps": [["揀一種玩法", "銀行、保障或日常理財，揀個情境生成五關挑戰。"], ["作答，再睇解說", "每題揀一個答案，睇清理由和知識來源；單人模式會按作答調整後面的題目。"], ["睇結果，再挑戰", "回看本局得分和重點。PK 目前使用演示對手，體驗同題比拼。"]]}, "spot": {"intro": "一張 AI 生活圖，藏住三處值得留意的金融細節。", "steps": [["揀個金融場景", "從服務枱、保障諮詢、金融群組揀一幕，也可以輸入題材配對情境。"], ["點出三處疑點", "直接點圖片找細節；卡住可以用提示，或改用文字找。"], ["睇解說，再換一幕", "對照每處細節與教育資料來源，隨時看答案或開始下一幕。"]]}, "fineprint": {"intro": "廣告講得吸引，對照細字才知道適用條件。", "steps": [["揀張虛構廣告", "從金融服務場景開始，或生成另一張條款挑戰。"], ["點出重要條件", "選出需要再問清楚的細字；也可以點預設問題了解更多。"], ["提交，再睇發現", "逐條對照理由，分清宣傳、限制與一般說明，再玩下一局。"]]}, "fraud": {"intro": "三位虛構角色，各有說法。由你追問，再找出誤導風險。", "steps": [["揀個金融話題", "從銀行資料、保障服務或金融群組揀一個場景，也可輸入題材。"], ["有疑問，就追問", "每輪可揀一位角色，點預設問題或自己打字，再對照記錄。"], ["隨時作出判斷", "最多五輪，隨時可以收尾。結果會展示線索和核實方法。"]]}};
(() => {
  const root = document.getElementById('hkhome');
  const dialog = root.querySelector('#home-howto');
  const start = root.querySelector('#home-howto-start');
  let trigger = null;
  root.addEventListener('click', event => {
    const button = event.target.closest('[data-howto]');
    const copy = button && HOWTO[button.dataset.howto];
    if (!copy || dialog.open) return;
    const card = button.closest('.home-app');
    trigger = button;
    root.querySelector('#home-howto-title').textContent = card.querySelector('h2').textContent;
    root.querySelector('#home-howto-intro').textContent = copy.intro;
    root.querySelector('#home-howto-steps').replaceChildren(...copy.steps.map(([title, text], index) => {
      const item = document.createElement('li');
      const number = document.createElement('span');
      number.className = 'home-step-number';
      number.textContent = index + 1;
      number.setAttribute('aria-hidden', 'true');
      const body = document.createElement('div');
      const heading = document.createElement('h3');
      heading.textContent = title;
      const paragraph = document.createElement('p');
      paragraph.textContent = text;
      body.append(heading, paragraph);
      item.append(number, body);
      return item;
    }));
    start.href = card.querySelector('.home-card-link').href;
    button.setAttribute('aria-expanded', 'true');
    dialog.showModal();
    root.querySelector('#home-howto-title').focus({ preventScroll: true });
    document.documentElement.classList.add('home-howto-open');
    dialog.scrollTop = 0;
  });
  root.querySelector('.home-sheet-close').addEventListener('click', () => dialog.close());
  start.addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', event => {
    if (event.target !== dialog) return;
    const rect = dialog.getBoundingClientRect();
    if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
  });
  dialog.addEventListener('close', () => {
    document.documentElement.classList.remove('home-howto-open');
    trigger?.setAttribute('aria-expanded', 'false');
    trigger?.focus({ preventScroll: true });
  });
})();
}
