<script>(() => {
 'use strict';
 window.HKQuizDuel=function({root,main,stories,icon,esc,source,modeTabs,homePhoto,onSolo}){
  const labels={bank:{title:'手機銀行',sub:'登入・核實・通知',icon:'online'},insurance:{title:'睇清保單',sub:'披露・條款・文件',icon:'work'},daily:{title:'生活收支',sub:'紀錄・需要・資訊',icon:'book'}};
  const available=stories.filter(s=>Array.isArray(s.questions)&&s.questions.length>=5);
  let topic=available[0]?.id||'bank',serial=0,epoch=0,timers=new Set();
  let state=blank();
  function blank(){return {view:'lobby',questions:[],opponentAnswers:[],answers:[],round:0,opponentReady:false,revealed:false,revealScheduled:false};}
  function live(){return String(root.dataset.view||'').startsWith('pk-');}
  function stop(){epoch++;timers.forEach(clearTimeout);timers.clear();state=blank();}
  function later(fn,delay){const version=epoch,id=setTimeout(()=>{timers.delete(id);if(version!==epoch||!live())return;fn();},delay);timers.add(id);}
  function shuffle(items,seed){const next=items.slice();let x=seed>>>0;for(let i=next.length-1;i>0;i--){x=(Math.imul(x,1664525)+1013904223)>>>0;const j=x%(i+1);[next[i],next[j]]=[next[j],next[i]];}return next;}
  const selectedStory=()=>available.find(s=>s.id===topic)||available[0];
  const question=()=>state.questions[state.round];
  const scores=()=>{const visible=state.view==='result'?5:state.round+(state.revealed?1:0);let you=0,opponent=0;for(let i=0;i<visible;i++){if(state.answers[i]===state.questions[i].q.correct)you+=100;if(state.opponentAnswers[i]===state.questions[i].q.correct)opponent+=100;}return {you,opponent};};
  const tag=()=>'<p class="qd-demo">'+icon('spark')+'<span>對戰示範 · 本機題庫 · 對手由程式模擬</span></p>';
  function lobby(){return '<section class="p-photo-hero"><img class="p-photo-bg" src="'+esc(homePhoto)+'" alt="" aria-hidden="true" decoding="async"><div class="p-photo-copy"><span class="p-photo-kicker">財智快打</span><h1 tabindex="-1" data-focus>PK 對戰</h1><p>同一題，睇下邊個識多啲。</p></div></section>'+modeTabs()+tag()+'<section class="qd-lobby-panel"><h2>揀個話題，開始對戰</h2><div class="qd-topics" role="group" aria-label="對戰話題">'+available.map(s=>{const l=labels[s.id]||{title:s.title,sub:'金融素養',icon:'book'};return '<button type="button" data-duel-topic="'+esc(s.id)+'" aria-pressed="'+(topic===s.id)+'">'+icon(l.icon)+'<strong>'+esc(l.title)+'</strong><small>'+esc(l.sub)+'</small></button>';}).join('')+'</div><div class="qd-rules"><span>5 題</span><span>答啱 +100</span><span>不比速度</span></div><button type="button" class="qd-primary" data-duel-action="match">開始配對示範'+icon('arrow')+'</button></section><p class="qd-footnote">雙方同題、同分，答錯不扣分。</p>';}
  function matching(){return modeTabs()+'<button type="button" class="qd-back" data-duel-action="cancel">'+icon('back')+'取消配對</button><section class="qd-matching"><div class="qd-versus-art qd-is-searching" aria-hidden="true"><span>你</span><b>'+icon('spark')+'</b><span>晴</span></div><h1 tabindex="-1" data-focus>準備對戰中…</h1><p>'+esc((labels[topic]||{}).title||selectedStory().title)+' · 同題 5 局</p><div class="qd-match-status" role="status"><i class="qd-spinner" aria-hidden="true"></i>正在準備五道題與示範對手</div>'+tag()+'</section>';}
  function scorebar(){const s=scores();return '<div class="qd-scoreboard" aria-label="你 '+s.you+' 分，示範對手阿晴 '+s.opponent+' 分"><div class="qd-player"><span class="qd-avatar">你</span><div><strong>你</strong><b data-duel-score="you">'+s.you+'</b></div></div><span class="qd-vs">VS</span><div class="qd-player qd-opponent"><div><strong>阿晴 <small>模擬</small></strong><b data-duel-score="opponent">'+s.opponent+'</b></div><span class="qd-avatar">晴</span></div></div>';}
  function roundView(){const entry=question(),q=entry.q,answer=state.answers[state.round],hasAnswer=Number.isInteger(answer),revealed=state.revealed;
   return modeTabs()+'<div class="qd-round-top"><button type="button" class="qd-back" data-duel-action="cancel">'+icon('back')+'離開對戰</button><span>'+esc((labels[topic]||{}).title||selectedStory().title)+' · '+(state.round+1)+' / 5</span></div>'+scorebar()+'<div class="qd-round-progress" aria-label="第 '+(state.round+1)+' 題，共5題">'+state.questions.map((_,i)=>'<span class="'+(i<state.round?'done':i===state.round?'current':'')+'"></span>').join('')+'</div><div class="qd-submit-status" aria-live="polite"><span>'+icon(hasAnswer?'check':'book')+(hasAnswer?'你已鎖定答案':'等你作答')+'</span><span>'+icon(state.opponentReady?'check':'spark')+(state.opponentReady?'阿晴已作答':'阿晴作答中')+' <small>示範</small></span></div><section class="qd-scenario"><div><span>'+esc(q.scene)+'</span><small>'+esc(q.speaker)+' · 虛構情境</small></div><p>'+esc(q.statement)+'</p></section><h1 class="qd-question" tabindex="-1" data-focus>'+esc(q.question)+'</h1><div class="qd-options" role="group" aria-label="選一個答案">'+entry.order.map((a,i)=>{
    const correct=revealed&&a===q.correct,chosen=answer===a,opponentPicked=revealed&&state.opponentAnswers[state.round]===a;
    return '<button type="button" class="qd-option'+(correct?' is-correct':revealed&&chosen?' is-missed':chosen?' is-locked':'')+'" data-duel-answer="'+a+'" aria-pressed="'+chosen+'"'+(hasAnswer?' disabled':'')+'><span class="qd-option-letter">'+(correct?icon('check'):['A','B','C'][i])+'</span><span class="qd-option-copy">'+esc(q.options[a])+((chosen||opponentPicked)?'<small>'+(chosen?'你選的':'')+(chosen&&opponentPicked?' · ':'')+(opponentPicked?'阿晴選的':'')+'</small>':'')+'</span></button>';
   }).join('')+'</div>'+(revealed?roundResult(q):hasAnswer?'<div class="qd-waiting" role="status"><i class="qd-spinner" aria-hidden="true"></i><span>答案已鎖定，等雙方準備好一齊揭曉。</span></div>':'<p class="qd-footnote">想清楚再揀，答啱 +100，答錯 0 分。</p>')+'<p class="qd-footnote qd-small-demo">對戰示範 · 阿晴由程式模擬</p>';
  }
  function roundResult(q){const mine=state.answers[state.round]===q.correct,theirs=state.opponentAnswers[state.round]===q.correct;return '<section class="qd-reveal" aria-labelledby="qd-reveal-heading"><div class="qd-reveal-heading"><span>'+icon(mine?'check':'bulb')+'</span><h2 id="qd-reveal-heading" tabindex="-1">'+(mine?'答啱了！':'記低呢個金融重點')+'</h2></div><div class="qd-round-scores"><span>你 <b>+'+(mine?100:0)+'</b></span><span>阿晴 <small>模擬</small> <b>+'+(theirs?100:0)+'</b></span></div><p class="qd-correct-answer">答案：'+esc(q.options[q.correct])+'</p><p class="qd-explanation">'+esc(q.explanation)+'</p><p class="qd-takeaway">'+icon('book')+esc(q.takeaway)+'</p><details class="qd-source"><summary>睇解說資料</summary><p>'+esc(q.legalLabel)+'</p>'+source(q)+'</details></section><button type="button" class="qd-primary" data-duel-action="next">'+(state.round===4?'睇對戰結果':'下一題')+icon('arrow')+'</button>';}
  function result(){const s=scores(),outcome=s.you>s.opponent?'win':s.you===s.opponent?'draw':'loss',title=outcome==='win'?'今局你贏！':outcome==='draw'?'打成平手！':'今局阿晴領先',caption=outcome==='win'?'連知識都一齊贏返嚟。':outcome==='draw'?'各有心得，下局再分高下。':'睇返金融重點，下局再試。';return modeTabs()+'<section class="qd-result-hero" data-duel-result="'+outcome+'"><span class="qd-result-mark">'+icon(outcome==='win'?'star':outcome==='draw'?'repeat':'book')+'</span><h1 tabindex="-1" data-focus>'+title+'</h1><p>'+caption+'</p></section>'+scorebar()+'<div class="qd-final-caption"><span>你答啱 '+s.you/100+' / 5</span><span>阿晴答啱 '+s.opponent/100+' / 5 · 模擬</span></div>'+tag()+'<div class="qd-review-heading"><h2>今局五個金融重點</h2><span>點開重溫</span></div><div class="qd-review">'+state.questions.map(({q},i)=>{const good=state.answers[i]===q.correct;return '<details class="qd-review-card" data-duel-review="'+i+'"><summary><span class="qd-review-number '+(good?'is-correct':'')+'">'+(good?icon('check'):i+1)+'</span><span>'+esc(q.takeaway)+'<small>'+(good?'你答啱了':'可以再記一下')+'</small></span><b aria-hidden="true">＋</b></summary><div class="qd-review-copy"><p class="qd-review-question">'+esc(q.question)+'</p><p>你揀：'+esc(q.options[state.answers[i]])+'</p><p>阿晴揀：'+esc(q.options[state.opponentAnswers[i]])+' <small>模擬</small></p><p class="qd-correct-answer">答案：'+esc(q.options[q.correct])+'</p><p>'+esc(q.explanation)+'</p><p class="qd-review-basis">'+esc(q.legalLabel)+'</p>'+source(q)+'</div></details>';}).join('')+'</div><button type="button" class="qd-primary" data-duel-action="again">再來一局'+icon('repeat')+'</button><button type="button" class="qd-secondary" data-duel-action="topics">換個話題</button><button type="button" class="qd-text-button" data-duel-action="solo">返回單人闖關</button><p class="qd-footnote">同題同分 · 不比速度 · 一般金融教育</p>';}
  function render(top=false,focus){
   const active=document.activeElement,keepTopic=active?.dataset?.duelTopic,keepAnswer=active?.dataset?.duelAnswer;
   root.dataset.view=state.view==='lobby'?'pk-lobby':state.view==='matching'?'pk-matching':state.view==='result'?'pk-result':state.revealed?'pk-reveal':Number.isInteger(state.answers[state.round])?'pk-waiting':'pk-round';
   root.setAttribute('aria-busy',String(state.view==='matching'||root.dataset.view==='pk-waiting'));
   main.innerHTML=state.view==='lobby'?lobby():state.view==='matching'?matching():state.view==='result'?result():roundView();
   if(top)window.scrollTo({top:0,behavior:'instant'});
   const target=focus?main.querySelector(focus):keepTopic?main.querySelector('[data-duel-topic="'+keepTopic+'"]'):keepAnswer!==undefined?main.querySelector('[data-duel-answer="'+keepAnswer+'"]:not(:disabled)'):null;
   if(target){target.focus({preventScroll:true});if(!top&&focus)target.scrollIntoView({block:'nearest',behavior:'auto'});}
  }
  function begin(){if(!['lobby','result'].includes(state.view)||!selectedStory())return;stop();serial++;const s=selectedStory();const entries=s.questions.slice(0,5).map((base,i)=>{const q=serial%2===0&&base.twist?base.twist:base;return {q,order:shuffle(q.options.map((_,n)=>n),serial*107+i*19+3)};});
   const correctCount=serial%2===1?3:4,wrong=new Set(shuffle([0,1,2,3,4],serial*23+19).slice(correctCount));
   state={...blank(),view:'matching',questions:entries,opponentAnswers:entries.map(({q},i)=>wrong.has(i)?(q.correct+1+(i%2))%q.options.length:q.correct)};
   render(true,'[data-focus]');later(()=>{state.view='round';render(true,'[data-focus]');prepareOpponent();},1500);
  }
  function prepareOpponent(){state.opponentReady=false;state.revealed=false;state.revealScheduled=false;later(()=>{if(state.view!=='round'||state.revealed)return;state.opponentReady=true;if(Number.isInteger(state.answers[state.round]))revealSoon();else render();},650+(state.round*173+serial*97)%650);}
  function revealSoon(){if(state.revealScheduled||state.revealed||!state.opponentReady||!Number.isInteger(state.answers[state.round]))return;state.revealScheduled=true;render();later(()=>{if(state.view!=='round'||state.revealed)return;state.revealed=true;state.revealScheduled=false;render(false,'#qd-reveal-heading');},360);}
  function answer(value){if(state.view!=='round'||state.revealed||Number.isInteger(state.answers[state.round]))return;const q=question().q;if(!Number.isInteger(value)||value<0||value>=q.options.length)return;state.answers.push(value);render();if(state.opponentReady)revealSoon();}
  function next(){if(state.view!=='round'||!state.revealed)return;if(state.round===4){state.view='result';render(true,'[data-focus]');return;}state.round++;state.revealed=false;state.opponentReady=false;state.revealScheduled=false;render(true,'[data-focus]');prepareOpponent();}
  root.addEventListener('click',e=>{if(!live())return;const button=e.target.closest('button');if(!button||!root.contains(button)||button.disabled)return;
   if(button.dataset.duelTopic&&state.view==='lobby'){if(!available.some(s=>s.id===button.dataset.duelTopic))return;topic=button.dataset.duelTopic;render();return;}
   if(button.dataset.duelAnswer!==undefined){answer(Number(button.dataset.duelAnswer));return;}
   const action=button.dataset.duelAction;if(action==='cancel'||action==='topics'){stop();render(true,'[data-focus]');return;}
   if(action==='match'||action==='again'){begin();return;}if(action==='next'){next();return;}if(action==='solo'){stop();onSolo();}
  });
  return {render,stop};
 };
})();

function order(seed,count){let x=seed>>>0;const a=Array.from({length:count},(_,i)=>i);for(let i=a.length-1;i>0;i--){x=(Math.imul(x,1664525)+1013904223)>>>0;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function matchTopic(topic){const text=topic.toLowerCase();return STORIES.map(s=>({s,score:s.aliases.reduce((n,k)=>n+(text.includes(k.toLowerCase())?k.length:0),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score)[0]?.s}

function play(){
 const r=run(),s=story(r),q=current(),answered=r.answers.length>r.index,answer=r.answers[r.index],canTwist=!q.isTwist&&catalog.has(q.baseKey+'~twist')&&r.index<4;
 const adaptive=answered&&answer!==q.correct&&canTwist;
 return '<div class="q-play-top"><button class="q-back" type="button" data-action="home" aria-label="返回話題入口">'+icon('back')+' 我的挑戰</button><span class="q-score">'+icon('star')+' '+score(r)+'</span></div><div class="q-session-topic">'+icon('spark')+'<span>'+esc(r.topic)+'</span></div><div class="q-progress-header"><span>第 <strong>'+(r.index+1)+'</strong> / 5 關</span><span>'+esc(q.scene)+'</span></div><ol class="q-progress" aria-label="關卡進度">'+r.steps.map((key,i)=>'<li class="'+(i<r.answers.length?(r.answers[i]===catalog.get(key).correct?'right':'wrong'):i===r.index?'current':'')+'"'+(i===r.index?' aria-current="step"':'')+' aria-label="第 '+(i+1)+' 關"><span>'+(i<r.answers.length?icon(r.answers[i]===catalog.get(key).correct?'check':'bulb'):i+1)+'</span></li>').join('')+'</ol>'+coachNote(r,q)+
 '<section class="q-scenario"><div class="q-speaker"><span class="q-avatar">'+icon(s.id==='bank'?'online':s.id==='insurance'?'work':'book')+'</span><span>'+esc(q.speaker)+'</span><small>虛構情境</small></div><p>「'+esc(q.statement)+'」</p></section><h2 class="q-question" tabindex="-1" data-focus>'+esc(q.question)+'</h2><p class="q-pick-label">揀一個最合適嘅答案</p><div class="q-options" role="group" aria-label="答案選項">'+order(r.seed+r.index,3).map((i,pos)=>{
 const mark=answered?(i===q.correct?' right':i===answer?' wrong':' muted'):'';
 return '<button class="q-option'+mark+'" type="button" data-answer="'+i+'" aria-pressed="'+(answered&&i===answer)+'"'+(answered?' disabled':'')+'><span class="q-option-letter">'+(answered&&i===q.correct?icon('check'):answered&&i===answer?icon('cross'):['A','B','C'][pos])+'</span><span>'+esc(q.options[i])+'</span>'+(answered&&i===answer?'<small>你揀的</small>':'')+'</button>';
 }).join('')+'</div>'+(answered?feedback(q,answer)+(busy?.kind==='next'?'<div class="q-next-loading" role="status" aria-live="polite"><i class="q-spinner"></i>'+esc(busy.message)+'</div>':
 (r.index<4?'<div class="q-next-coach"><span>'+icon('spark')+'</span><p>'+(adaptive?'啱啱嘅重點值得再練。下一關換個條件，你再判斷一次。':'呢關完成，繼續編排下一個場景。')+'</p></div>':'')+'<button class="q-primary" type="button" data-action="next">'+(r.index===4?'睇我的學習小結':'編排下一關')+' '+icon(r.index===4?'arrow':'spark')+'</button>'+(canTwist&&!adaptive?'<button class="q-secondary" type="button" data-action="twist">'+icon('repeat')+' 換個條件再考我</button>':'')):'<p class="q-gentle">唔使趕時間，諗清楚再揀。</p>');
}
function result(){
 const r=run(),n=score(r),missed=r.steps.filter((key,i)=>r.answers[i]!==catalog.get(key).correct),weak=[...new Set(missed.map(k=>catalog.get(k).takeaway))];
 return '<button class="q-back" type="button" data-action="home">'+icon('back')+' 話題入口</button><section class="q-result-hero"><div class="q-trophy" aria-hidden="true">'+icon(n===5?'star':'spark')+'</div><span class="q-eyebrow">你的學習小結</span><h1 tabindex="-1" data-focus>'+(n===5?'五關全啱，記得重點！':n>=3?'又多識一點金融知識':'將幾個重點帶返生活')+'</h1><p class="q-result-topic">'+esc(r.topic)+'</p><div class="q-result-score"><strong>'+n+'</strong><span>/ 5</span></div><div class="q-result-dots" aria-label="'+n+' 題答啱">'+r.steps.map((key,i)=>'<span class="'+(r.answers[i]===catalog.get(key).correct?'right':'wrong')+'">'+icon(r.answers[i]===catalog.get(key).correct?'check':'bulb')+'</span>').join('')+'</div></section><section class="q-personal-summary"><div>'+icon('spark')+'<strong>'+(weak.length?'下次，先重溫呢幾點':'下次，可以換個條件挑戰')+'</strong></div><p>'+(weak.length?weak.map(esc).join(' '):'今局嘅判斷都答啱。再換一組條件，睇下你會唔會留意到不同細節。')+'</p></section><div class="q-section-head"><h2>今局的五個判斷</h2><span>點開重溫</span></div><div class="q-review">'+r.steps.map((key,i)=>{
 const q=catalog.get(key),good=r.answers[i]===q.correct;
 return '<details class="q-review-card" data-review="'+i+'"><summary><span class="q-review-state '+(good?'right':'wrong')+'">'+icon(good?'check':'bulb')+'</span><span>'+esc(q.takeaway)+'<small>'+(good?'已掌握':'再記一下')+(q.isTwist?' · 條件變化':'')+'</small></span><b aria-hidden="true">＋</b></summary><div class="q-review-copy"><p class="q-review-question">'+esc(q.question)+'</p><p>你揀了：'+esc(q.options[r.answers[i]])+'</p><p class="q-review-answer">合適答案：'+esc(q.options[q.correct])+'</p><p>'+esc(q.explanation)+'</p><p class="q-review-basis">'+esc(q.legalLabel)+'</p>'+source(q)+'</div></details>';
 }).join('')+'</div><button class="q-primary" type="button" data-action="personalize">'+icon('spark')+' '+(weak.length?'按我的錯題，再出一局':'換一組條件，再出一局')+'</button><button class="q-secondary" type="button" data-action="home">換個話題 '+icon('arrow')+'</button><p class="q-footnote">本機情境編排示範 · 小結只反映今局答題。<br>一般金融教育 · 引用資料不代表來源機構認可。</p>';
}
function render(top=false,focus){if(mode==='pk'){duel.render(top,focus);return;}main.innerHTML=state.view==='generating'&&busy?generating():state.view==='home'?home():state.view==='brief'?brief():state.view==='result'?result():play();root.dataset.view=state.view;root.setAttribute('aria-busy',String(Boolean(busy)));if(top)window.scrollTo({top:0,behavior:'instant'});if(focus){const el=main.querySelector(focus);el?.focus({preventScroll:true});if(!top)el?.scrollIntoView({block:'nearest',behavior:'auto'})}}
function stop(){token++;timers.forEach(clearTimeout);timers=[];busy=null;if(state.view==='generating')state.view='home'}
function generate(topic,priority=[],forceStory){
 if(busy)return;topic=safeTopic(topic);const s=forceStory?STORIES.find(s=>s.id===forceStory):matchTopic(topic);state.draft=topic;
 if(!topic||!s){error=topic?'呢個話題暫時未有範本。今次示範支援手機銀行、保險條款同生活收支，可以試下上面嘅例子。':'先寫一個生活話題，或揀上面嘅例子。';state.view='home';save();render(false,'#q-topic');return;}
 error='';const previous=state.sessions.filter(r=>r.storyId===s.id).at(-1),seed=(Math.floor(Math.random()*4294967296))>>>0;const t=++token;
 busy={kind:'session',step:0,topic,storyId:s.id};state.view='generating';save();render(true,'[data-focus]');
 timers=[setTimeout(()=>{if(t!==token)return;busy.step=1;render()},650),setTimeout(()=>{if(t!==token)return;busy.step=2;render()},1300),setTimeout(()=>{
  if(t!==token)return;
  const preferred=[...new Set(priority)].filter(k=>catalog.get(k)?.storyId===s.id).map(k=>catalog.get(k).baseKey);
  const ordered=[...new Set([...preferred,...s.questions.map(q=>s.id+'/'+q.id)])];
  let steps=ordered.map((key,i)=>{
   if(!catalog.has(key+'~twist'))return key;
   const prev=previous?.steps.filter(k=>catalog.get(k).baseKey===key).at(-1);
   if(priority.length&&preferred.includes(key)){const failed=priority.filter(k=>catalog.get(k).baseKey===key).at(-1);return failed.endsWith('~twist')?key:key+'~twist';}
   return prev?(prev.endsWith('~twist')?key:key+'~twist'):i%2===1?key+'~twist':key;
  }).slice(0,5);
  const id='round-'+(++state.counter),r={id,storyId:s.id,topic,seed,steps,answers:[],index:0,complete:false,tailored:priority.length>0};
  state.sessions.push(r);state.sessions=state.sessions.slice(-12);state.active=id;state.view='brief';busy=null;timers=[];save();render(true,'[data-focus]');
 },2050)];
}
function advance(forceTwist=false){
 if(busy||state.view!=='play')return;const r=run(),q=current();if(r.answers.length!==r.index+1)return;
 if(r.index===4){r.complete=true;state.view='result';save();render(true,'[data-focus]');return;}
 const twist=!q.isTwist&&catalog.has(q.baseKey+'~twist')&&(forceTwist||r.answers[r.index]!==q.correct),t=++token;
 busy={kind:'next',message:twist?'正在改變關鍵條件，準備追問…':'正在編排下一個場景…'};render(false,'.q-next-loading');
 timers=[setTimeout(()=>{if(t!==token)return;if(twist){r.steps.splice(r.index+1,0,q.baseKey+'~twist');r.steps=r.steps.slice(0,5)}r.index++;busy=null;timers=[];save();render(true,'[data-focus]')},950)];
}
const duel=window.HKQuizDuel({root,main,stories:STORIES,icon,esc,source,modeTabs,homePhoto:HOME_PHOTO,onSolo:()=>setMode('solo')});
function setMode(next){if(!['solo','pk'].includes(next))return;stop();duel.stop();mode=next;state.view='home';save();try{history.replaceState(null,'',next==='pk'?'#pk':'#solo')}catch{}render(true,'[data-focus]')}
window.addEventListener('hashchange',()=>{if(location.hash==='#pk'||location.hash==='#solo')setMode(location.hash.slice(1))});
root.addEventListener('input',e=>{if(e.target.id==='q-topic'){state.draft=e.target.value.slice(0,80);error='';const note=main.querySelector('#q-topic-error');if(note)note.textContent='';save()}});
root.addEventListener('submit',e=>{if(e.target.id==='q-generator'){e.preventDefault();generate(main.querySelector('#q-topic').value)}});
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||!root.contains(b)||b.disabled)return;if(b.dataset.quizMode){setMode(b.dataset.quizMode);return;}if(mode==='pk')return;const action=b.dataset.action;
 if(action==='cancel'||action==='home'){stop();state.view='home';save();render(true,'[data-focus]');return;}
 if(busy)return;
 if(b.dataset.topic){state.draft=b.dataset.prompt;error='';save();render(false,'#q-topic');return;}
 if(b.dataset.session){const r=state.sessions.find(r=>r.id===b.dataset.session);if(!r)return;state.active=r.id;state.view=r.complete?'result':'play';save();render(true,'[data-focus]');return;}
 if(b.dataset.answer!==undefined&&state.view==='play'){
  const r=run(),q=current(),a=Number(b.dataset.answer);if(r.answers.length!==r.index||!Number.isInteger(a)||a<0||a>=q.options.length)return;
  r.answers.push(a);save();render(false,'#q-feedback-heading');return;
 }
 if(action==='begin'&&state.view==='brief'){state.view='play';save();render(true,'[data-focus]');return;}
 if(action==='regenerate'&&run()){generate(run().topic,[],run().storyId);return;}
 if(action==='next'){advance(false);return;}if(action==='twist'){advance(true);return;}
 if(action==='personalize'&&state.view==='result'){const r=run(),missed=r.steps.filter((key,i)=>r.answers[i]!==catalog.get(key).correct);generate(r.topic,missed,r.storyId)}
});
window.addEventListener('pagehide',()=>{duel.stop();const pending=busy;stop();if(pending)save()});
window.addEventListener('pageshow',e=>{if(e.persisted)render()});
if(location.hash==='#solo')state.view='home';
render();
})();
