ine);border-radius:16px;overflow:hidden;background:var(--p-surface)}#hkfineprint summary{cursor:pointer;min-height:48px;padding:13px 15px;font-size:14px;font-weight:550}#hkfineprint .fp-question-inner{padding:0 14px 15px}#hkfineprint .fp-question-list{display:grid;gap:8px}#hkfineprint .fp-question{background:var(--p-soft);border:0;border-radius:12px;text-align:left;padding:12px;font-size:13px;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px}#hkfineprint .fp-question svg{width:17px;height:17px;color:var(--p-primary)}#hkfineprint .fp-question[aria-pressed=true]{box-shadow:inset 0 0 0 1px var(--p-primary)}#hkfineprint .fp-reply{margin-top:12px;border-left:3px solid var(--p-primary);padding:8px 11px;background:var(--p-soft);border-radius:0 9px 9px 0;font-size:13px;line-height:1.75}#hkfineprint .fp-reply b{display:block;font-size:11px;color:var(--p-primary);margin-bottom:4px}#hkfineprint .fp-action-bar{position:sticky;bottom:0;z-index:5;margin:19px -3px -1px;padding:12px 3px max(12px,env(safe-area-inset-bottom));background:var(--p-bg);border-top:1px solid var(--p-line)}#hkfineprint .fp-selected{font-size:12px;color:var(--p-muted);text-align:center;margin:0 0 9px;min-height:20px}#hkfineprint .fp-primary,#hkfineprint .fp-secondary{width:100%;min-height:48px;display:flex;align-items:center;justify-content:center;gap:9px;border-radius:25px;font-size:14px;font-weight:600;padding:12px 16px}#hkfineprint .fp-primary{border:0;background:var(--p-primary);color:var(--p-on)}#hkfineprint .fp-primary svg,#hkfineprint .fp-secondary svg{width:19px;height:19px}#hkfineprint .fp-secondary{border:1px solid var(--p-line);background:var(--p-surface);color:var(--p-text)}#hkfineprint .fp-result-hero{padding:18px 18px 23px;margin-bottom:20px;border-radius:21px;background:var(--p-soft);text-align:center}#hkfineprint .fp-result-seal{height:57px;width:57px;background:var(--p-surface);border:1px solid var(--p-line);border-radius:50%;display:grid;place-items:center;margin:0 auto 13px;color:var(--p-primary)}#hkfineprint .fp-result-seal svg{width:28px;height:28px}#hkfineprint .fp-result-hero h1{font-size:25px;margin:6px 0 8px}#hkfineprint .fp-result-hero>p{font-size:13px;color:var(--p-muted)}#hkfineprint .fp-stats{display:flex;justify-content:center;gap:0;margin:21px 0 0}#hkfineprint .fp-stat{padding:0 26px}#hkfineprint .fp-stat+.fp-stat{border-left:1px solid var(--p-line)}#hkfineprint .fp-stat strong{display:block;font-size:27px;line-height:1.2;font-weight:650;color:var(--p-primary)}#hkfineprint .fp-stat small{font-size:11px;color:var(--p-muted)}#hkfineprint .fp-findings{display:grid;gap:12px}#hkfineprint .fp-finding{border:1px solid var(--p-line);border-radius:16px;padding:16px;background:var(--p-surface)}#hkfineprint .fp-finding-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:9px}#hkfineprint .fp-finding-head h3{font-size:15px;flex:1}#hkfineprint .fp-result-tag{font-size:10px;border-radius:20px;padding:3px 8px;color:var(--fp-green);background:var(--fp-green-bg);white-space:nowrap}#hkfineprint .fp-result-tag.missed,#hkfineprint .fp-result-tag.extra{color:var(--fp-amber);background:var(--fp-amber-bg)}#hkfineprint .fp-finding p{font-size:13px;color:var(--p-muted)}#hkfineprint .fp-contrast{display:grid;gap:4px;margin:10px 0;background:var(--p-soft);border-radius:11px;padding:10px 11px;font-size:13px}#hkfineprint .fp-contrast span:first-child{color:var(--p-muted);font-size:11px}#hkfineprint .fp-normal{margin-top:18px;border:1px solid var(--p-line);border-radius:16px}#hkfineprint .fp-normal .fp-findings{padding:0 14px 14px;gap:16px}#hkfineprint .fp-normal-item+.fp-normal-item{border-top:1px solid var(--p-line);padding-top:13px}#hkfineprint .fp-normal-item h3{font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}#hkfineprint .fp-normal-item p{font-size:12px;color:var(--p-muted);margin-top:5px}#hkfineprint .fp-takeaway{border-radius:16px;padding:17px;background:var(--p-soft);margin:19px 0 20px}#hkfineprint .fp-takeaway>span{font-size:11px;color:var(--p-primary);font-weight:600}#hkfineprint .fp-takeaway p{margin-top:7px;font-size:15px;font-weight:550;line-height:1.7}#hkfineprint .fp-result-actions{display:grid;gap:10px}#hkfineprint .fp-plain-link{display:block;margin:8px auto 0;border:0;background:none;color:var(--p-primary);min-height:44px;padding:8px 12px;font-size:13px}#hkfineprint .fp-small-note{font-size:11px;line-height:1.65;color:var(--p-muted);text-align:center;margin-top:21px}#hkfineprint .fp-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

<div id="hkfineprint">
<header class="p-top">HKChat Finance</header>
<main class="x-main" id="fp-main"></main>
</div>
<script>
(()=>{'use strict';
const root=document.getElementById('hkfineprint');
const main=root.querySelector('#fp-main');
const STORAGE='hkchat-finance-fineprint-v1';
const icons={arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',back:'<path d="M19 12H5m6-6-6 6 6 6"/>',check:'<path d="m5 12 4 4 10-10"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 5h4m-3 14h2"/>',gym:'<path d="m6 8 10 8M3 8l5-5m8 18 5-5M2 5l3-3m14 20 3-3M5 11l6-6m2 14 6-6"/>',camera:'<path d="M4 7h4l2-3h4l2 3h4v13H4Z"/><circle cx="12" cy="13" r="4"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5m-13-11h5m-5 3h3"/>',chat:'<path d="M21 11a8 8 0 0 1-8 8H7l-5 3V11a9.5 9.5 0 0 1 19 0Z"/><path d="M7 10h9m-9 4h6"/>'};
const icon=name=>'<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(icons[name]||icons.arrow)+'</svg>';
const CASES=__FINEPRINT_BASE_CASES__;
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({version:1,view:'home',caseId:null,selected:[],answer:null,questionOpen:false,completed:[]});
function restore(){const next=fresh();try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(!saved||saved.version!==1)return next;next.completed=CASES.filter(c=>Array.isArray(saved.completed)&&saved.completed.includes(c.id)).map(c=>c.id);const c=CASES.find(c=>c.id===saved.caseId);if(c){next.caseId=c.id;next.view=['home','challenge','result'].includes(saved.view)?saved.view:'home';next.selected=c.clauses.filter(q=>Array.isArray(saved.selected)&&saved.selected.includes(q.id)).map(q=>q.id);next.answer=c.questions.some(q=>q.id===saved.answer)?saved.answer:null;next.questionOpen=Boolean(saved.questionOpen)}return next}catch{return next}}
let state=restore();
const current=()=>CASES.find(c=>c.id===state.caseId);
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch{}}
function go(view){state.view=view;save();render();window.scrollTo({top:0,behavior:'instant'});const heading=main.querySelector('[data-focus]');if(heading){heading.setAttribute('tabindex','-1');heading.focus({preventScroll:true})}}
function start(id){if(!CASES.some(c=>c.id===id))return;state.caseId=id;state.selected=[];state.answer=null;state.questionOpen=false;go('challenge')}
function topline(c){return '<div class="fp-topline"><button class="fp-back" type="button" data-action="home">'+icon('back')+'選擇關卡</button><span class="fp-fiction">'+(state.view==='challenge'?'AI 圖像 · 虛構廣告':'示範練習')+'</span></div>'}
function challenge(c){return topline(c)+adCard(c)+'<h2>哪些細字，值得再問清楚？</h2><p class="fp-instruction">點選與廣告承諾有差異，或補充了重要條件的條款。</p><div class="fp-clauses">'+c.clauses.map((q,i)=>'<button type="button" class="fp-clause" data-clause="'+q.id+'" aria-pressed="'+state.selected.includes(q.id)+'"><span class="fp-check">'+icon('check')+'</span><span class="fp-clause-copy"><small>細字 0'+(i+1)+'</small>'+esc(q.text)+'</span></button>').join('')+'</div><details class="fp-question-box" id="fp-questions"'+(state.questionOpen?' open':'')+'><summary>未肯定？追問一句</summary><div class="fp-question-inner"><div class="fp-question-list">'+c.questions.map(q=>'<button type="button" class="fp-question" data-question="'+q.id+'" aria-pressed="'+(state.answer===q.id)+'"><span>'+esc(q.text)+'</span>'+icon('chat')+'</button>').join('')+'</div><div id="fp-reply" aria-live="polite">'+answerHTML(c)+'</div></div></details><div class="fp-action-bar"><p id="fp-selected" class="fp-selected" aria-live="polite">'+selectedText()+'</p><button type="button" class="fp-primary" id="fp-submit" data-action="submit">提交我的發現 '+icon('arrow')+'</button></div>'}
function answerHTML(c){const q=c.questions.find(q=>q.id===state.answer);return q?'<div class="fp-reply"><b>'+esc(c.brand)+' · 示範回覆</b>'+esc(q.answer)+'</div>':''}
function selectedText(){return state.selected.length?'已圈出 '+state.selected.length+' 條細字':'也可直接提交，看看有沒有遺漏'}
function result(c){const risks=c.clauses.filter(q=>q.risk);const found=risks.filter(q=>state.selected.includes(q.id));const extra=c.clauses.filter(q=>!q.risk&&state.selected.includes(q.id));const passed=found.length===risks.length&&extra.length===0;const headline=passed?'細字通關！':found.length===risks.length?'看得仔細，再分清一點':'這次有新發現';const sub=passed?'重要條件全找到了，也分清了普通說明。':found.length===risks.length?'重要條件都找到了，但有些說明不用圈。':'把廣告和細字放在一起，條件就清楚了。';return topline(c)+'<section class="fp-result-hero"><div class="fp-result-seal">'+icon(passed?'check':'search')+'</div><div class="fp-eyebrow">'+esc(c.label)+' · 本局發現</div><h1 data-focus>'+headline+'</h1><p>'+sub+'</p><div class="fp-stats"><div class="fp-stat"><strong>'+found.length+'<span style="font-size:16px"> / '+risks.length+'</span></strong><small>重要條件已發現</small></div><div class="fp-stat"><strong>'+extra.length+'</strong><small>普通說明被多選</small></div></div></section><div class="fp-section-title"><h2>廣告沒說完整的事</h2></div><div class="fp-findings">'+risks.map(q=>'<article class="fp-finding"><div class="fp-finding-head"><h3>'+esc(q.title)+'</h3><span class="fp-result-tag '+(state.selected.includes(q.id)?'':'missed')+'">'+(state.selected.includes(q.id)?'你發現了':'這條漏看了')+'</span></div><div class="fp-contrast"><span>廣告說 '+esc(q.promise)+'</span><strong>'+esc(q.actual)+'</strong></div><p>'+esc(q.why)+'</p></article>').join('')+'</div><details class="fp-normal"'+(extra.length?' open':'')+'><summary>另外兩條，為甚麼不用圈？</summary><div class="fp-findings">'+c.clauses.filter(q=>!q.risk).map(q=>'<article class="fp-normal-item"><h3>'+esc(q.title)+(state.selected.includes(q.id)?'<span class="fp-result-tag extra">本次多選</span>':'')+'</h3><p>'+esc(q.why)+'</p></article>').join('')+'</div></details><div class="fp-takeaway"><span>帶走一個小習慣</span><p>'+esc(c.takeaway)+'</p></div><div class="fp-result-actions"><button type="button" class="fp-primary" data-action="next">挑戰下一關 '+icon('arrow')+'</button><button type="button" class="fp-secondary" data-action="retry">再試這關</button></div><button type="button" class="fp-plain-link" data-action="home">回到全部關卡</button>'+sourcesHTML(c)+'<p class="fp-small-note">本局只比較虛構宣傳與條款文字，供閱讀練習；不提供產品建議或真實個案裁定。</p>'}
function render(){const c=current();if(!c&&state.view!=='home')state.view='home';root.dataset.view=state.view;main.innerHTML=state.view==='home'?home():state.view==='challenge'?challenge(c):result(c);const details=main.querySelector('#fp-questions');if(details)details.addEventListener('toggle',()=>{state.questionOpen=details.open;save()})}
root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||!root.contains(button))return;if(button.dataset.case){start(button.dataset.case);return}const c=current();if(button.dataset.clause&&state.view==='challenge'&&c){const id=button.dataset.clause;if(!c.clauses.some(q=>q.id===id))return;state.selected=state.selected.includes(id)?state.selected.filter(s=>s!==id):[...state.selected,id];save();button.setAttribute('aria-pressed',String(state.selected.includes(id)));main.querySelector('#fp-selected').textContent=selectedText();return}if(button.dataset.question&&state.view==='challenge'&&c){if(!c.questions.some(q=>q.id===button.dataset.question))return;state.answer=button.dataset.question;state.questionOpen=true;save();main.querySelectorAll('[data-question]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.question===state.answer)));main.querySelector('#fp-reply').innerHTML=answerHTML(c);return}const action=button.dataset.action;if(action==='home'){go('home');return}if(action==='resume'&&c){go('challenge');return}if(action==='submit'&&c&&state.view==='challenge'){const pass=c.clauses.every(q=>state.selected.includes(q.id)===q.risk);if(pass&&!state.completed.includes(c.id))state.completed.push(c.id);go('result');return}if(action==='retry'&&c){start(c.id);return}if(action==='next'&&c){const i=CASES.findIndex(q=>q.id===c.id);const next=CASES.find((q,j)=>j>i&&!state.completed.includes(q.id))||CASES.find(q=>q.id!==c.id&&!state.completed.includes(q.id))||CASES[(i+1)%CASES.length];start(next.id)}});
render();
})();
</script>
